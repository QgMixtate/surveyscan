[project]
name = "surveyscan"
version = "0.1.0"
description = "Сканер обследования: инвентаризация, уязвимости с привязкой к БДУ ФСТЭК, проверка конфигураций"
requires-python = ">=3.10"
dependencies = ["lxml>=4.9", "PyYAML>=6.0", "Jinja2>=3.1", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
ssh = ["paramiko>=3.0"]
winrm = ["pywinrm>=0.4"]
api = ["fastapi>=0.100", "pydantic>=2", "uvicorn[standard]>=0.23", "cryptography>=42"]
test = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
surveyscan = "surveyscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["surveyscan*"]

[tool.setuptools.package-data]
surveyscan = ["templates/*.j2"]
"surveyscan.api" = ["static/*", "static/vendor/*", "static/vendor/fonts/*"]

[tool.setuptools.data-files]
"share/surveyscan/collectors" = ["collectors/*.sh", "collectors/*.ps1"]
"share/surveyscan/samples/hosts" = ["samples/hosts/*"]
"share/surveyscan/samples/bdu" = ["samples/bdu/*"]
"share/surveyscan/samples/advisories" = ["samples/advisories/*"]
"share/surveyscan/samples" = ["samples/*.json"]
"share/surveyscan/rules" = ["rules/*.yaml"]
"share/surveyscan/catalog" = ["catalog/*.yaml"]
"share/surveyscan/reports" = ["reports/*.yaml"]
"share/surveyscan/checks" = ["checks/*.yaml"]
"share/surveyscan/profiles" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: surveyscan-web
on:
  push:
    paths: ['v2/web/**', 'v2/contracts/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['v2/web/**', 'v2/contracts/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: v2/web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate pinned C03 types and standalone schema validators
        run: |
          npm run generate
          git diff --exit-code -- src/generated
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: surveyscan-web
          path: v2/web/dist
          if-no-files-found: error

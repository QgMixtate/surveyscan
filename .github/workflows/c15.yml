name: surveyscan-c15-contract-preparation
on:
  push:
    paths: ['docs/plans/surveyscan-v2/contracts/C15/**', 'v2/contracts/c15*', 'v2/internal/platform/wire/inventory12*', 'v2/internal/agent/windowsinventory/**', 'v2/internal/platform/winstate/**', 'v2/cmd/surveyscan-agent/**', 'v2/go.mod', 'v2/go.sum', '.github/workflows/c15.yml']
  pull_request:
    paths: ['docs/plans/surveyscan-v2/contracts/C15/**', 'v2/contracts/c15*', 'v2/internal/platform/wire/inventory12*', 'v2/internal/agent/windowsinventory/**', 'v2/internal/platform/winstate/**', 'v2/cmd/surveyscan-agent/**', 'v2/go.mod', 'v2/go.sum', '.github/workflows/c15.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surveyscan-c15-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contract-and-native-baseline:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema checker
        run: python -m pip install -r docs/plans/surveyscan-v2/contracts/C15/requirements.txt
      - name: Synthetic C15 fixtures (no native inventory)
        run: python docs/plans/surveyscan-v2/contracts/C15/validate.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: v2/go.sum
      - name: Go payload validation (synthetic inputs only)
        working-directory: v2
        run: go test -count=1 ./internal/platform/wire
      - name: Native Windows API baseline (isolated, no delivery or service)
        working-directory: v2
        env:
          SURVEYSCAN_C15_TEST_AGENT: ${{ github.workspace }}\v2\surveyscan-agent.exe
        shell: pwsh
        run: |
          go build -o surveyscan-agent.exe ./cmd/surveyscan-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -v ./internal/agent/windowsinventory
      - name: Isolated Windows private DACL, reparse, bounded file and process lock primitives
        working-directory: v2
        run: go test -count=1 -v ./internal/platform/winstate
      - name: Build and run version command only on Windows Server 2022
        working-directory: v2
        shell: pwsh
        run: |
          go build -o surveyscan-agent.exe ./cmd/surveyscan-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & .\surveyscan-agent.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parsed = $version | ConvertFrom-Json
          if ($parsed.component -ne 'agent') { throw 'Unexpected component' }
          Write-Output $version
          Write-Output 'Only isolated baseline APIs, private-state primitives and version were checked; no scheduled Windows sender, runtime adoption, service, update or reboot.'

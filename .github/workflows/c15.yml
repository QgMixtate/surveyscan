name: surveyscan-c15-contract-preparation
on:
  push:
    paths: ['docs/plans/surveyscan-v2/contracts/C15/**', 'v2/contracts/c15*', 'v2/internal/platform/wire/inventory12*', 'v2/internal/agent/windowsinventory/**', 'v2/internal/platform/winstate/**', 'v2/internal/platform/diskspool/**', 'v2/internal/platform/privatefile/**', 'v2/internal/platform/machineid/**', 'v2/internal/agent/**', 'v2/internal/platform/winservice/**', 'v2/cmd/surveyscan-agent/**', 'v2/go.mod', 'v2/go.sum', '.github/workflows/c15.yml']
  pull_request:
    paths: ['docs/plans/surveyscan-v2/contracts/C15/**', 'v2/contracts/c15*', 'v2/internal/platform/wire/inventory12*', 'v2/internal/agent/windowsinventory/**', 'v2/internal/platform/winstate/**', 'v2/internal/platform/diskspool/**', 'v2/internal/platform/privatefile/**', 'v2/internal/platform/machineid/**', 'v2/internal/agent/**', 'v2/internal/platform/winservice/**', 'v2/cmd/surveyscan-agent/**', 'v2/go.mod', 'v2/go.sum', '.github/workflows/c15.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surveyscan-c15-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contract-and-native-baseline:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema checker
        run: python -m pip install -r docs/plans/surveyscan-v2/contracts/C15/requirements.txt
      - name: Synthetic C15 fixtures (no native inventory)
        run: python docs/plans/surveyscan-v2/contracts/C15/validate.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: v2/go.sum
      - name: Go payload validation (synthetic inputs only)
        working-directory: v2
        run: go test -count=1 ./internal/platform/wire
      - name: Native Windows API baseline (isolated, no delivery or service)
        working-directory: v2
        env:
          SURVEYSCAN_C15_TEST_AGENT: ${{ github.workspace }}\v2\surveyscan-agent.exe
        shell: pwsh
        run: |
          go build -o surveyscan-agent.exe ./cmd/surveyscan-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -v ./internal/agent/windowsinventory
      - name: Isolated Windows private DACL, reparse, bounded file and process lock primitives
        working-directory: v2
        shell: pwsh
        run: |
          go test -count=1 -v ./internal/platform/winstate ./internal/platform/diskspool ./internal/platform/machineid ./internal/platform/winservice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -v -run "TestWindowsProfileCacheThroughPrivateAdapters|TestWindowsStateDirIsPrivateAndLocked|TestWindowsPrepareIsStablePrivateAndConfigNeedsPrivateDirectory" ./internal/agent
      - name: Build and run version command only on Windows Server 2022
        working-directory: v2
        shell: pwsh
        run: |
          go build -o surveyscan-agent.exe ./cmd/surveyscan-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & .\surveyscan-agent.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parsed = $version | ConvertFrom-Json
          if ($parsed.component -ne 'agent') { throw 'Unexpected component' }
          Write-Output $version
          Write-Output 'Only isolated baseline APIs, private-state primitives and version were checked; no scheduled Windows sender, runtime adoption, service, update or reboot.'
      - name: Compiled agent prepare with an operator-style private config (icacls, no network)
        working-directory: v2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'c15-operator'
          $cfgDir = Join-Path $root 'cfg'
          $state = Join-Path $root 'state'
          $user = "$env:USERNAME"
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          # Каталог и каждый файл в нём получают собственный защищённый DACL без унаследованных записей.
          & icacls $cfgDir /inheritance:r /grant:r 'SYSTEM:(OI)(CI)F' 'BUILTIN\Administrators:(OI)(CI)F' "${user}:(OI)(CI)F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'icacls directory' }
          $config = @{ tenant_id = [guid]::NewGuid().ToString(); site_id = [guid]::NewGuid().ToString(); network_scope_id = [guid]::NewGuid().ToString(); collector_url = 'https://collector.invalid'; collector_source_id = [guid]::NewGuid().ToString(); ca_certificate_file = (Join-Path $cfgDir 'ca.pem'); state_directory = $state } | ConvertTo-Json
          $file = Join-Path $cfgDir 'agent.json'
          Set-Content -Path $file -Value $config -Encoding utf8NoBOM
          & icacls $file /inheritance:r /grant:r 'SYSTEM:F' 'BUILTIN\Administrators:F' "${user}:F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'icacls file' }
          $first = & .\surveyscan-agent.exe prepare --config $file
          if ($LASTEXITCODE -ne 0) { throw 'prepare failed' }
          $second = & .\surveyscan-agent.exe prepare --config $file
          if ($LASTEXITCODE -ne 0) { throw 'second prepare failed' }
          $a = $first | ConvertFrom-Json
          $b = $second | ConvertFrom-Json
          if (-not $a.source_id -or $a.source_id -ne $b.source_id -or $a.csr_sha256 -ne $b.csr_sha256) { throw 'prepare is not stable' }
          if ($first -match 'PRIVATE KEY') { throw 'prepare printed key material' }
          Write-Output "prepare ok, identity stable (source $($a.source_id))"

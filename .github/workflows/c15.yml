name: surveyscan-c15-contract-preparation
on:
  push:
    paths: ['docs/plans/surveyscan-v2/contracts/C15/**', '.github/workflows/c15.yml']
  pull_request:
    paths: ['docs/plans/surveyscan-v2/contracts/C15/**', '.github/workflows/c15.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surveyscan-c15-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contract-and-version-only:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema checker
        run: python -m pip install jsonschema==4.26.0
      - name: Synthetic C15 fixtures (no native inventory)
        run: python docs/plans/surveyscan-v2/contracts/C15/validate.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: v2/go.sum
      - name: Build and run version command only on Windows Server 2022
        working-directory: v2
        shell: pwsh
        run: |
          go build -o surveyscan-agent.exe ./cmd/surveyscan-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & .\surveyscan-agent.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parsed = $version | ConvertFrom-Json
          if ($parsed.component -ne 'agent') { throw 'Unexpected component' }
          Write-Output $version
          Write-Output 'Inventory, service, DACL, update and reboot were not executed.'

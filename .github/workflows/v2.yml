name: surveyscan-v2
on:
  push:
    paths: ['v2/**', 'docs/plans/surveyscan-v2/contracts/C03/**', '.github/workflows/v2.yml']
  pull_request:
    paths: ['v2/**', 'docs/plans/surveyscan-v2/contracts/C03/**', '.github/workflows/v2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surveyscan-v2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  c04:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: v2/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v2/web/package-lock.json
      - name: Contract checker dependencies
        run: |
          python -m venv .contract-tools
          .contract-tools/bin/pip install -r ../docs/plans/surveyscan-v2/contracts/C03/checks/requirements.txt
      - name: Format, architecture, unit tests, vet and C03 contracts
        run: make CONTRACT_PYTHON=.contract-tools/bin/python verify
      - name: Agent collection ownership, heartbeat progress and capability chain race checks
        run: go test -race -count=1 ./internal/agent ./internal/collector ./internal/platform/wire
      - name: Build server, collector, agent and CLI
        run: make build
      - name: Build separate Web UI
        working-directory: v2/web
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- src/generated  # типы и валидаторы Web совпадают с контрактами
          npm run build
      - name: Signed release bundle, independent Web version and verified staging
        env:
          SURVEYSCAN_RELEASE_SEARCH: "1"
        run: GO=go python scripts/release_smoke.py
      - name: Static systemd unit verification (not boot acceptance)
        run: python scripts/unit_check.py
      - name: Start local PostgreSQL, OpenBao, backend and proxy
        run: python scripts/dev.py up
      - name: Build search service (Rust, Tantivy; ADR C28) for the C29 integration test
        working-directory: v2/search
        run: cargo build --release --locked
      - name: Mock directory (OpenLDAP over LDAPS, not AD) for the C31 integration test
        run: python scripts/ldap_mock.py up >> "$GITHUB_ENV"
      - name: Real PostgreSQL integration tests
        env:
          SURVEYSCAN_SEARCH_BIN: ${{ github.workspace }}/v2/search/target/release/surveyscan-search
          SURVEYSCAN_REQUIRE_LDAP_MOCK: "1"
        run: make integration
      - name: HTTP, dependency outage and restart checks
        run: python scripts/smoke.py
      - name: Real binary auth, console bootstrap and restart checks
        run: python scripts/auth_smoke.py
      - name: Compiled collector, mTLS and signed center result
        run: .contract-tools/bin/python scripts/machine_smoke.py
      - name: Live host agent, three scheduled cycles and heartbeat
        run: .contract-tools/bin/python scripts/agent_smoke.py
      - name: Real daemon SIGKILL, offline spools and reconnect
        run: .contract-tools/bin/python scripts/recovery_smoke.py
      - name: Real ENOSPC in disposable tmpfs
        run: GO=go python scripts/diskfault.py
      - name: Scoped OpenBao KV, Transit, token renewal and masked audit
        run: .contract-tools/bin/python scripts/bao_smoke.py
      - name: OpenBao seal, restart, durable ACK and renewal relay
        run: .contract-tools/bin/python scripts/bao_pipeline.py
      - name: Opt-in inventory1.2 center, scoped Transit, projection and typed API
        run: .contract-tools/bin/python scripts/c15_center_smoke.py
      - name: Opt-in inventory1.2 collector relay, offline spool and cold restart
        run: .contract-tools/bin/python scripts/c15_relay_smoke.py
      - name: Linux agent inventory1.2 live host snapshot through center (platform bound at registration)
        env:
          C15_SMOKE_PLATFORM: linux/amd64
        run: .contract-tools/bin/python scripts/c15_center_smoke.py
      - name: Linux agent inventory1.2 collector relay, offline spool and cold restart
        env:
          C15_SMOKE_PLATFORM: linux/amd64
        run: .contract-tools/bin/python scripts/c15_relay_smoke.py
      - name: VM center stand selftest (grant by prepare.json, compiled Linux agent enroll and run12 daemon, facts in PostgreSQL)
        run: .contract-tools/bin/python scripts/vm_center.py --selftest
      - name: Portable package upload (C23.03) — slow body to the center, surveyscanctl via deploy/nginx.conf edge
        run: .contract-tools/bin/python scripts/portable_http_smoke.py
      - name: Linux agent run12 stage exit code (not enrolled = 2) and non-root collection
        run: |
          set -eu
          BIN="$PWD/.dist/surveyscan-agent"
          WORK="$(mktemp -d)"; chmod 700 "$WORK"; mkdir "$WORK/cfg"; chmod 700 "$WORK/cfg"
          python3 - "$WORK" <<'PY'
          import json, sys, uuid
          w = sys.argv[1]
          cfg = {'tenant_id': str(uuid.uuid4()), 'site_id': str(uuid.uuid4()), 'network_scope_id': str(uuid.uuid4()),
                 'collector_url': 'https://collector.invalid', 'collector_source_id': str(uuid.uuid4()),
                 'ca_certificate_file': w + '/cfg/ca.pem', 'state_directory': w + '/state'}
          open(w + '/cfg/agent.json', 'w').write(json.dumps(cfg))
          PY
          chmod 600 "$WORK/cfg/agent.json"
          "$BIN" prepare --config "$WORK/cfg/agent.json" > "$WORK/prepare1.json"
          # Обновление: новый бинарник по другому пути на том же состоянии — личность прежняя.
          cp "$BIN" "$WORK/surveyscan-agent-upgraded" && chmod 755 "$WORK/surveyscan-agent-upgraded"
          "$WORK/surveyscan-agent-upgraded" prepare --config "$WORK/cfg/agent.json" > "$WORK/prepare2.json"
          cmp "$WORK/prepare1.json" "$WORK/prepare2.json" || { echo "identity changed across binary replacement"; exit 1; }
          set +e; "$BIN" run12 --config "$WORK/cfg/agent.json" > /dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 2 || { echo "run12 unenrolled exit $rc, want 2 (Open)"; exit 1; }
          # Сбор без root: тот же набор секций (профиль прав «ограниченные»).
          cp "$BIN" /tmp/surveyscan-agent-nonroot && chmod 755 /tmp/surveyscan-agent-nonroot
          sudo -u nobody /tmp/surveyscan-agent-nonroot collect12 > "$WORK/nonroot.json"
          python3 - "$WORK/nonroot.json" <<'PY'
          import json, sys
          sections = {s['name']: s for s in json.load(open(sys.argv[1]))['sections']}
          for name in ('identity', 'os', 'network', 'hardware', 'users_groups', 'routes_ports', 'resources'):
              assert sections[name]['status'] == 'partial' and sections[name]['records'], name
          for name in ('updates', 'protection', 'neighbors'):
              assert sections[name]['status'] == 'unsupported', name
          # C16.02: services из systemctl — partial со строками на хосте с systemd, unavailable без него (значения не выдумываются)
          svc = sections['services']
          assert (svc['status'] == 'partial' and svc['records']) or svc['status'] in ('unavailable', 'unsupported'), ('services', svc['status'])
          print('non-root collect12: 7 sections partial, services', svc['status'], ', 3 unsupported')
          PY
      - name: Live agent TLS key rotation and committed ACK loss
        run: .contract-tools/bin/python scripts/renewal_smoke.py
      - name: Collector TLS rotation, queues, committed ACK loss and race-checked hot reload
        run: .contract-tools/bin/python scripts/collector_renewal_smoke.py
      - name: Split roles (C35) - api and two workers, exactly-once events, session survives api failover
        run: .contract-tools/bin/python scripts/split_smoke.py
      - name: PostgreSQL outage under a live center (C36) - fail fast, no partial write, pool reconnects without restart
        run: .contract-tools/bin/python scripts/pool_failover_smoke.py
      - name: Shards (C37) - two cells on two PostgreSQL clusters behind the router, tenant move with verification
        run: .contract-tools/bin/python scripts/shard_smoke.py
      - name: HA PostgreSQL (C38) - writer + streaming replica, planned switchover, writer loss, fencing watchdog, failback
        run: .contract-tools/bin/python scripts/ha_smoke.py
      - name: DR drill (C39) - quiesced DR set, source destroyed, restore into a new cluster and catalog
        run: .contract-tools/bin/python scripts/dr_drill.py
      - name: Network discovery (C51) - subnet from Web API, real collector claims the job, TCP/ARP/ICMP probes, signed result
        run: .contract-tools/bin/python scripts/discovery_smoke.py
      - name: Collect target from Web (C51.03) - credential in the secret store, collector enrolls the target agent, SSH collection, no files on the host
        run: .contract-tools/bin/python scripts/collect_target_smoke.py
      - name: Canary and version skew (C40.02) - N migrations under running N-1, N api beside N-1, collector upgrade and rollback
        run: .contract-tools/bin/python scripts/canary_skew_smoke.py
      - name: Human CLI login, two tenants, pagination and remote logout
        run: .contract-tools/bin/python scripts/cli_smoke.py
      - name: Central profiles, signed source diagnostics and tenant policy
        run: .contract-tools/bin/python scripts/profiles_smoke.py
      - name: Three real agents, quota backpressure and simultaneous reconnect
        run: .contract-tools/bin/python scripts/reconnect_smoke.py
      - name: PostgreSQL backup, clean DB restore and authenticated write
        run: .contract-tools/bin/python scripts/backup_smoke.py
      - name: Isolated OpenBao Raft restore, non-exportable keys and restart
        run: .contract-tools/bin/python scripts/bao_restore_smoke.py
      - name: Common PG, Bao and filesystem checkpoint with pending replay
        run: .contract-tools/bin/python scripts/checkpoint_smoke.py
      - name: Previous C11 server data upgraded with current binary
        run: .contract-tools/bin/python scripts/upgrade_smoke.py
      - name: Verified release update, startup rollback and updater SIGKILL recovery
        run: GO=go .contract-tools/bin/python scripts/update_smoke.py
      - name: Retain sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-reports
          include-hidden-files: true
          path: |
            v2/.local/contracts-validation.json
            v2/.local/smoke.json
            v2/.local/auth-smoke.json
            v2/.local/machine-smoke.json
            v2/.local/agent-smoke.json
            v2/.local/recovery-smoke.json
            v2/.local/diskfault-smoke.json
            v2/.local/bao-smoke.json
            v2/.local/bao-pipeline.json
            v2/.local/c15-center-smoke.json
            v2/.local/c15-relay-smoke.json
            v2/.local/c15-center-smoke-linux.json
            v2/.local/c15-relay-smoke-linux.json
            v2/.local/renewal-smoke.json
            v2/.local/collector-renewal-smoke.json
            v2/.local/cli-smoke.json
            v2/.local/profiles-smoke.json
            v2/.local/c13-release-smoke.json
            v2/.local/c13-unit-check.json
            v2/.local/c13-pg-restore-smoke.json
            v2/.local/c13-bao-restore-smoke.json
            v2/.local/c13-checkpoint-smoke.json
            v2/.local/c13-upgrade-smoke.json
            v2/.local/c13-update-smoke.json
            v2/.local/c14-reconnect-smoke.json
          if-no-files-found: ignore
      - name: Stop isolated development stack
        if: always()
        run: python scripts/dev.py down

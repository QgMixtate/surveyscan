name: surveyscan-v2
on:
  push:
    paths: ['v2/**', 'docs/plans/surveyscan-v2/contracts/C03/**', '.github/workflows/v2.yml']
  pull_request:
    paths: ['v2/**', 'docs/plans/surveyscan-v2/contracts/C03/**', '.github/workflows/v2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surveyscan-v2-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  c04:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: v2/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v2/web/package-lock.json
      - name: Contract checker dependencies
        run: |
          python -m venv .contract-tools
          .contract-tools/bin/pip install -r ../docs/plans/surveyscan-v2/contracts/C03/checks/requirements.txt
      - name: Format, architecture, unit tests, vet and C03 contracts
        run: make CONTRACT_PYTHON=.contract-tools/bin/python verify
      - name: Build server, collector, agent and CLI
        run: make build
      - name: Build separate Web UI
        working-directory: v2/web
        run: |
          npm ci
          npm run build
      - name: Signed release bundle, independent Web version and verified staging
        run: GO=go python scripts/release_smoke.py
      - name: Static systemd unit verification (not boot acceptance)
        run: python scripts/unit_check.py
      - name: Start local PostgreSQL, OpenBao, backend and proxy
        run: python scripts/dev.py up
      - name: Real PostgreSQL integration tests
        run: make integration
      - name: HTTP, dependency outage and restart checks
        run: python scripts/smoke.py
      - name: Real binary auth, console bootstrap and restart checks
        run: python scripts/auth_smoke.py
      - name: Compiled collector, mTLS and signed center result
        run: .contract-tools/bin/python scripts/machine_smoke.py
      - name: Live host agent, three scheduled cycles and heartbeat
        run: .contract-tools/bin/python scripts/agent_smoke.py
      - name: Real daemon SIGKILL, offline spools and reconnect
        run: .contract-tools/bin/python scripts/recovery_smoke.py
      - name: Real ENOSPC in disposable tmpfs
        run: GO=go python scripts/diskfault.py
      - name: Scoped OpenBao KV, Transit, token renewal and masked audit
        run: .contract-tools/bin/python scripts/bao_smoke.py
      - name: OpenBao seal, restart, durable ACK and renewal relay
        run: .contract-tools/bin/python scripts/bao_pipeline.py
      - name: Opt-in inventory1.2 center, scoped Transit, projection and typed API
        run: .contract-tools/bin/python scripts/c15_center_smoke.py
      - name: Opt-in inventory1.2 collector relay, offline spool and cold restart
        run: .contract-tools/bin/python scripts/c15_relay_smoke.py
      - name: Live agent TLS key rotation and committed ACK loss
        run: .contract-tools/bin/python scripts/renewal_smoke.py
      - name: Collector TLS rotation, queues, committed ACK loss and race-checked hot reload
        run: .contract-tools/bin/python scripts/collector_renewal_smoke.py
      - name: Human CLI login, two tenants, pagination and remote logout
        run: .contract-tools/bin/python scripts/cli_smoke.py
      - name: Central profiles, signed source diagnostics and tenant policy
        run: .contract-tools/bin/python scripts/profiles_smoke.py
      - name: Three real agents, quota backpressure and simultaneous reconnect
        run: .contract-tools/bin/python scripts/reconnect_smoke.py
      - name: PostgreSQL backup, clean DB restore and authenticated write
        run: .contract-tools/bin/python scripts/backup_smoke.py
      - name: Isolated OpenBao Raft restore, non-exportable keys and restart
        run: .contract-tools/bin/python scripts/bao_restore_smoke.py
      - name: Common PG, Bao and filesystem checkpoint with pending replay
        run: .contract-tools/bin/python scripts/checkpoint_smoke.py
      - name: Previous C11 server data upgraded with current binary
        run: .contract-tools/bin/python scripts/upgrade_smoke.py
      - name: Verified release update, startup rollback and updater SIGKILL recovery
        run: GO=go .contract-tools/bin/python scripts/update_smoke.py
      - name: Retain sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1-reports
          include-hidden-files: true
          path: |
            v2/.local/contracts-validation.json
            v2/.local/smoke.json
            v2/.local/auth-smoke.json
            v2/.local/machine-smoke.json
            v2/.local/agent-smoke.json
            v2/.local/recovery-smoke.json
            v2/.local/diskfault-smoke.json
            v2/.local/bao-smoke.json
            v2/.local/bao-pipeline.json
            v2/.local/c15-center-smoke.json
            v2/.local/c15-relay-smoke.json
            v2/.local/renewal-smoke.json
            v2/.local/collector-renewal-smoke.json
            v2/.local/cli-smoke.json
            v2/.local/profiles-smoke.json
            v2/.local/c13-release-smoke.json
            v2/.local/c13-unit-check.json
            v2/.local/c13-pg-restore-smoke.json
            v2/.local/c13-bao-restore-smoke.json
            v2/.local/c13-checkpoint-smoke.json
            v2/.local/c13-upgrade-smoke.json
            v2/.local/c13-update-smoke.json
            v2/.local/c14-reconnect-smoke.json
          if-no-files-found: ignore
      - name: Stop isolated development stack
        if: always()
        run: python scripts/dev.py down

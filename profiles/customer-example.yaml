# Пример профиля заказчика: наследует базовый, ужесточает пороги и исключает неприменимое.
id: customer-example
extends: base
title: "Профиль заказчика (пример): внутренние стандарты ИБ"
docs: [p21, p239, cis]
exclude:
  - LNX-FS-01        # у заказчика /tmp на tmpfs по другому стандарту
  - LNX-BOOT-*       # параметры загрузки проверяются отдельно при внедрении
params:
  LNX-PWD-02: {value: 12}           # длина пароля не меньше 12
  WIN-PWD-01: {value: 12}
  LNX-PWD-03: {value: [1, 60]}      # смена пароля раз в 60 дней
  WIN-PWD-03: {value: [1, 60]}
  LNX-PWD-05: {value: [1, 5]}       # блокировка после 5 попыток
  WIN-LCK-01: {value: [1, 5]}

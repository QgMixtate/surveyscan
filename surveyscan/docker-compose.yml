# surveyscan — поднять бэкенд с веб-интерфейсом и PostgreSQL одной командой:
#   docker compose up --build
# затем открыть http://localhost:8000  («+ Новое сканирование» -> указать подсети/хосты -> «Схема сети»)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: surveyscan
      POSTGRES_PASSWORD: surveyscan
      POSTGRES_DB: surveyscan          # обслуживающая БД; роль-суперпользователь имеет CREATEDB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveyscan"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy     # бэкенд стартует только когда БД готова
    environment:
      SURVEYSCAN_PG_DSN: "host=db port=5432 user=surveyscan password=surveyscan"
      # ключ шифрования секретов УЗ. Задайте свой: `export SURVEYSCAN_SECRET_KEY=...` перед up
      # (любая строка/фраза). Если пусто — ключ сгенерируется в томе /data (теряется вместе с ним).
      SURVEYSCAN_SECRET_KEY: "${SURVEYSCAN_SECRET_KEY:-}"
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data
    cap_add:                             # для определения ОС в nmap (-O, raw-сокеты); без них скан падает на версии сервисов
      - NET_RAW
      - NET_ADMIN

volumes:
  pgdata:
  appdata:

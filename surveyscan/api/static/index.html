<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>surveyscan</title>
<link rel="stylesheet" href="/static/vendor/fonts.css">
<script src="/static/vendor/react.production.min.js"></script>
<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/cytoscape.umd.js"></script>
<style>
  :root{
    --bg:#F7F8FA; --ink:#16181D; --muted:#667085; --faint:#98A2B3;
    --line:#E4E7EC; --line2:#EEF0F3; --panel:#fff;
    --sidebar:#11141B; --sidebar-on:#171B24; --nav-tx:#C4CAD4; --nav-sec:#7b8597; --nav-rail:#6B7AD6;
    --accent:#3D4EA6; --accent-tx:#6B7AD6;
    --crit:#B3261E; --crit-bg:#FBE9E8; --high:#C2410C; --high-bg:#FBEDE3;
    --med:#92600A; --med-bg:#FBF4E0; --low:#2F7D4F; --low-bg:#E7F3EC; --unk:#667085; --unk-bg:#EEF0F3;
    --ok:#2F7D4F; --warn:#D9A213; --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:"JetBrains Mono",monospace}
  .app{display:flex;min-height:100vh}
  /* nav */
  .nav{width:226px;flex-shrink:0;background:var(--sidebar);color:#AEB4C0;padding:16px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 18px 16px;color:#fff;font-weight:700;font-size:16px;}
  .brand .logo{width:25px;height:25px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;}
  .navsec{padding:13px 18px 5px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--nav-sec);}
  .navi{display:flex;align-items:center;gap:11px;padding:8px 18px;font-size:13.5px;color:var(--nav-tx);cursor:pointer;border:0;background:none;width:100%;text-align:left;font-family:inherit;}
  .navi:hover{color:#fff}
  .navi.on{background:var(--sidebar-on);color:#fff;box-shadow:inset 3px 0 0 var(--nav-rail);font-weight:600;}
  .navi .ico{width:17px;text-align:center;flex-shrink:0;opacity:.85}
  .navi .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 6px;}
  .navi .cnt{margin-left:auto;color:var(--nav-sec);font-size:11px;}
  .nav .foot{margin-top:auto;padding:14px 18px 0;font-size:10.5px;color:#5a6479;line-height:1.5}
  /* main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{height:54px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:5}
  .crumb{font-size:14px;color:var(--muted)} .crumb b{font-weight:600;color:var(--ink)} .crumb .sep{margin:0 8px;color:var(--faint)}
  .search{margin-left:6px;width:290px;max-width:34vw;height:32px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 11px;color:var(--faint);font-size:13px}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .av{width:31px;height:31px;border-radius:6px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
  .body{flex:1;padding:18px 22px 40px}
  .h1{font-size:19px;font-weight:700;margin:0 0 2px} .sub{font-size:13px;color:var(--muted);margin:0 0 16px}
  /* buttons */
  .btn{height:34px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;font-size:13px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn.dark{background:var(--sidebar);border-color:var(--sidebar)}
  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:13px 15px}
  .kpi .l{font-size:11.5px;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .kpi .n{font-size:27px;font-weight:700;line-height:1} .kpi .d{font-size:11.5px;margin-top:7px;color:var(--muted)}
  .dotc{width:8px;height:8px;border-radius:50%;display:inline-block}
  /* cards */
  .cols{display:grid;gap:12px}
  .cols.dash{grid-template-columns:1.4fr 1fr 1fr}
  @media(max-width:1100px){.cols.dash{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px}
  .ch{padding:12px 15px;border-bottom:1px solid var(--line2);display:flex;align-items:center}
  .ch h3{margin:0;font-size:13px;font-weight:600} .ch .more{margin-left:auto;font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}
  .cb{padding:13px 15px}
  /* chips */
  .chip{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .c-critical{background:var(--crit-bg);color:var(--crit)} .c-high{background:var(--high-bg);color:var(--high)}
  .c-medium{background:var(--med-bg);color:var(--med)} .c-low{background:var(--low-bg);color:var(--low)} .c-unknown{background:var(--unk-bg);color:var(--unk)}
  .tagline{display:inline-block;padding:2px 9px;border-radius:5px;background:#EEF1F6;color:#44506a;font-size:11.5px}
  .tag-ok{background:var(--low-bg);color:var(--low)} .tag-ro{background:#EEF0F3;color:#667085}
  /* tables */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 8px 8px}
  td{padding:9px 8px;border-top:1px solid var(--line2);vertical-align:top}
  tr.click{cursor:pointer} tr.click:hover td{background:#FAFBFC}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .sub2{color:var(--faint);font-size:11px}
  .link{color:var(--accent);font-weight:600;cursor:pointer}
  /* risk */
  .risk{display:inline-flex;align-items:center;gap:7px}
  .riskbar{width:60px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden} .riskbar span{display:block;height:100%;background:var(--crit)}
  /* scan list */
  .scan{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line2);font-size:12.5px} .scan:first-of-type{border-top:0}
  .scan .nm{font-weight:600} .scan .meta{color:var(--muted);font-size:11.5px} .scan .pct{margin-left:auto;color:var(--muted);font-size:11.5px}
  .d-ok{background:var(--ok)} .d-run{background:var(--accent)} .d-wait{background:var(--warn)} .d-err{background:var(--crit)}
  /* donut */
  .donutwrap{display:flex;align-items:center;gap:18px}
  .sevrow{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:13px} .sevrow .tag{width:92px;flex-shrink:0} .sevrow .v{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
  /* tabs */
  .tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:14px 0 18px}
  .tab{padding:8px 0;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .tab .cnt{background:#EEF0F3;color:#667085;border-radius:10px;font-size:11px;padding:0 7px}
  /* two-col detail */
  .detail{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px}
  .detail > *{min-width:0} .detail .cb{overflow-x:auto}
  @media(max-width:1000px){.detail{grid-template-columns:minmax(0,1fr)}}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line2);font-size:13px} .kv:first-child{border-top:0} .kv .k{color:var(--muted)} .kv .v{font-weight:600}
  .seg{margin-top:14px} .seg .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:5px}
  .cvsstile{border:1px solid var(--line);border-radius:8px;padding:14px 18px;text-align:center;min-width:150px}
  .cvsstile .n{font-size:28px;font-weight:700;color:var(--crit);line-height:1} .cvsstile .l{font-size:11px;color:var(--muted);margin-top:4px}
  .cmd{background:#11141B;color:#E6E9F0;border-radius:6px;padding:9px 12px;font-family:"JetBrains Mono",monospace;font-size:12px;margin-top:8px;overflow-x:auto}
  .warn{background:var(--med-bg);border:1px solid #F0E2BD;border-radius:6px;padding:10px 12px;font-size:12px;color:#6b5412;margin-top:10px}
  .pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:8px}
  .pagehead .ic{width:52px;height:52px;border-radius:10px;background:#11141B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .pagehead .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
  .pagehead .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .riskbadge{background:#11141B;color:#fff;border-radius:6px;padding:5px 11px;font-weight:700;font-size:13px}
  /* profile cards */
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px} @media(max-width:1100px){.pgrid{grid-template-columns:1fr}}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 17px;display:flex;flex-direction:column;gap:9px}
  .pcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .pcard .pt{display:flex;align-items:center;gap:11px} .pcard .pic{width:40px;height:40px;border-radius:8px;background:#F0F1F5;display:flex;align-items:center;justify-content:center;font-size:18px}
  .pcard.on .pic{background:#11141B}
  .pcard .pn{font-weight:700;font-size:14px} .pcard .psub{font-size:12px;color:var(--muted)}
  .pcard .pd{font-size:12.5px;color:#48506a;line-height:1.5}
  .pcard .ptags{display:flex;flex-wrap:wrap;gap:6px}
  .pcard .pf{display:flex;align-items:center;margin-top:auto;padding-top:4px}
  /* forms */
  .field{display:flex;flex-direction:column;gap:5px} .field label{font-size:12px;color:var(--muted)}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid #E7EAF6;border-color:var(--accent)}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp 1s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  a{color:var(--accent)}
  .empty{color:var(--muted);padding:26px;text-align:center}
  iframe{width:100%;height:720px;border:0;display:block;border-radius:8px;border:1px solid var(--line)}
  /* network map */
  .maptools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .maptools .sp{flex:1}
  #cy{width:100%;height:620px;background:#F7F8FA;border:1px solid var(--line);border-radius:8px}
  .legend2{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
  .legend2 span{display:inline-flex;align-items:center;gap:7px}
  .legend2 i{width:14px;height:14px;border-radius:3px;display:inline-block}
  textarea{resize:vertical}
  .credrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .credrow select{min-width:148px}
  .credrow input{flex:1;min-width:120px}
  .btn.sm{padding:6px 12px;font-size:13px}
  .xbtn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;width:34px;height:34px;cursor:pointer;flex:none}
  .xbtn:hover{color:var(--crit,#b4232a);border-color:var(--crit,#b4232a)}
  .credpick{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .credopt{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
  .credopt.on{border-color:var(--accent);background:rgba(61,78,166,.05)}
  .credopt input{flex:none;width:16px;height:16px}
  .credopt .cn{font-weight:600}
  .credopt .ct{font-size:12px;color:var(--muted)}
  .credopt .cu{margin-left:auto;font-size:12px;color:var(--muted)}
  .tasklog{max-height:360px;overflow:auto;background:var(--sidebar,#11141B);color:#cfd6e4;border-radius:6px;padding:12px 14px;font-family:JetBrains Mono,monospace;font-size:12.5px;line-height:1.75}
  .tasklog .lt{color:#6b7488}
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/app.js"></script>
</body>
</html>

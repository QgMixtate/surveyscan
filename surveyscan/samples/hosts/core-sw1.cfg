! Синтетическая конфигурация коммутатора (show running-config)
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname core-sw1
!
enable password cisco123
!
no aaa new-model
!
ip ssh version 2
ip http server
!
interface Vlan10
 ip address 10.10.1.2 255.255.255.0
!
snmp-server community public RO
logging host 10.10.1.50
ntp server 10.10.1.1
!
line con 0
 exec-timeout 0 0
line vty 0 4
 transport input telnet ssh
line vty 5 15
 transport input ssh
!
end

[package]
name = "surveyscan-search"
version = "0.1.0"
edition = "2021"
publish = false
description = "SurveyScan full-text search sidecar (Tantivy): derived, rebuildable index; PostgreSQL is the source of truth (ADR C28)"

[dependencies]
tantivy = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
regex = "1"

[profile.release]
lto = "thin"

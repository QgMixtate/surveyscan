pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 1m;
  server {
    listen 8080;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;
    location = /version.json { root /usr/share/nginx/html; }
    location = /index.html { root /usr/share/nginx/html; }
    location /health/ { proxy_pass http://backend:8080; }
    # C23.03: загрузка portable-пакета — лимит как у центра (MaxPackageBytes 128 МиБ) и длинные таймауты.
    location ~ ^/api/v1/sources/[0-9a-f-]+/portable-import$ { client_max_body_size 128m; proxy_request_buffering on; proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_pass http://backend:8080; }
    location /api/ { proxy_pass http://backend:8080; }
    location /contracts/ { alias /usr/share/nginx/contracts/; default_type application/json; }
    location / { root /usr/share/nginx/html; try_files $uri /index.html; }
  }
}

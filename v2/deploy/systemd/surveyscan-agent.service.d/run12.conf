# Включает цикл профиля инвентаризации 1.2 (Linux) вместо прежнего run (профиль 1.0).
# Установка: cp -r surveyscan-agent.service.d /etc/systemd/system/ && systemctl daemon-reload && systemctl restart surveyscan-agent
# Откат: удалить drop-in и перезапустить службу. Состояние (личность, очередь) в StateDirectory не меняется.
# Центр должен быть настроен на платформу linux/amd64 при регистрации (inventory_platform) и иметь включённый профиль 1.2.
[Service]
ExecStart=
ExecStart=/opt/surveyscan/current/bin/surveyscan-agent run12 --config %d/config
# Код выхода 2 — агент не зарегистрирован / нет личности (этап Open): повторные перезапуски бесполезны до enroll.
# Код 1 — состояние/блокировка (например, перекрытие при обновлении): повтор допустим.
RestartPreventExitStatus=2

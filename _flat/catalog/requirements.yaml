# Каталог требований: документы и привязка проверок к их пунктам.
#
# ВАЖНО: привязка — ЧЕРНОВИК. Приказы ФСТЭК задают меры, а не значения параметров;
# каждая привязка должна быть согласована с консалтингом до использования в отчётах заказчику.
# Приказ № 117: привязка к мерам не заполнена — формируется по методическим рекомендациям
# ФСТЭК к приказу 117 (задача консалтинга). Колонка в отчёте остаётся пустой.

documents:
  fstek-linux:
    short: "ФСТЭК Linux"
    title: "Рекомендации по безопасной настройке операционных систем Linux (ФСТЭК России, 25.12.2022)"
    status: "действует"
  p117:
    short: "Пр. 117"
    title: "Приказ ФСТЭК России от 11.04.2025 № 117 (ГИС и ИС госорганов)"
    status: "действует с 01.03.2026; заменил приказ № 17"
  p17:
    short: "Пр. 17"
    title: "Приказ ФСТЭК России от 11.02.2013 № 17"
    status: "утратил силу 01.03.2026; только для ГИС, аттестуемых по прежним правилам"
  p21:
    short: "Пр. 21"
    title: "Приказ ФСТЭК России от 18.02.2013 № 21 (ИСПДн)"
    status: "действует; опубликован проект замены"
  p239:
    short: "Пр. 239"
    title: "Приказ ФСТЭК России от 25.12.2017 № 239 (значимые объекты КИИ)"
    status: "действует"
  cis:
    short: "CIS"
    title: "CIS Benchmarks (для соответствующей ОС / оборудования)"
    status: "отраслевая практика"
  astra:
    short: "Astra"
    title: "Руководство по КСЗ Astra Linux Special Edition"
    status: "документация вендора"

